<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-Only Parallax</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="parallax-wrapper">
    
    <div class="parallax-group">
      <div class="parallax-layer parallax-back" style="background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1920&auto=format&fit=crop');"></div>
      <div class="parallax-layer parallax-base">
        <div class="content-card">
          <h1>Parallax scroll demo</h1>
          <p>Imagine some Sun Tzu art of war quote here</p>
        </div>
      </div>
    </div>

    <div class="parallax-group solid-section">
      <div class="parallax-layer parallax-base">
        <div class="content-card" style="color: #333;">
          <h2>Static Content Section</h2>
          <p>The background image from above slides behind this section.</p>
        </div>
      </div>
    </div>

    <div class="parallax-group">
      <div class="parallax-layer parallax-back" style="background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1920&auto=format&fit=crop');"></div>
      <div class="parallax-layer parallax-base">
        <div class="content-card">
          <h2>Smooth as Butter</h2>
          <p>Rendered entirely by the GPU.</p>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
